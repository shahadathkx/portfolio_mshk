<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="100%" height="100%">
  <defs>
    <!-- Gemini Radiant Gradient -->
    <linearGradient id="gemini-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2563eb" />
      <stop offset="35%" stop-color="#38bdf8" />
      <stop offset="70%" stop-color="#8b5cf6" />
      <stop offset="100%" stop-color="#ec4899" />
    </linearGradient>

    <!-- Gemini Sparkle Gradient -->
    <linearGradient id="sparkle-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="60%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#a855f7" />
    </linearGradient>

    <!-- Subtle Drop Shadow -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Squircle Card -->
  <rect x="6" y="6" width="116" height="116" rx="28" fill="#090d16" stroke="url(#gemini-grad)" stroke-width="3.5" />

  <!-- Inner Soft Glow -->
  <rect x="10" y="10" width="108" height="108" rx="24" fill="url(#gemini-grad)" opacity="0.08" />

  <!-- Gemini 4-Point Star Sparkle in Top-Right -->
  <path d="M 100 20 Q 100 30 110 30 Q 100 30 100 40 Q 100 30 90 30 Q 100 30 100 20 Z" fill="url(#sparkle-grad)" opacity="0.95" />

  <!-- Second Mini Sparkle -->
  <circle cx="86" cy="22" r="1.5" fill="#38bdf8" opacity="0.8" />

  <!-- MSHK Brand Text with Gemini Gradient -->
  <text
    x="64"
    y="78"
    font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif"
    font-weight="900"
    font-size="34"
    letter-spacing="1.5"
    text-anchor="middle"
    fill="url(#gemini-grad)"
    filter="url(#glow)"
  >
    MSHK
  </text>
</svg>
